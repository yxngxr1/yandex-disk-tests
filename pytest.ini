[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
addopts =
   --rootdir=.
   -v
   -ra
norecursedirs = .venv .git
markers =
    # По уровню важности
    critical: Критичные
    high: Высокий приоритет
    medium: Средний приоритет
    low: Низкий приоритет
    
    # По сценариям
    positive: Позитивные сценарии
    negative: Негативные сценарии